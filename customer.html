.mu{color:var(--mu);font-size:14px}
.t{font-size:40px;font-weight:800;color:var(--ac);margin:14px 0 4px;font-variant-numeric:tabular-nums;direction:ltr}
.r{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #262626}
</style>
